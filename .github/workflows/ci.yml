name: CI

# Runs the five local test commands on every pull request to main, and again on
# main itself after a merge. Feature-branch pushes deliberately do NOT trigger
# CI: a branch with no PR is not a merge candidate, and when both triggers fired
# on one commit they produced two check-runs sharing the required check's name,
# so which run satisfied the gate was not deterministic.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the suites read the repo and nothing else. No secrets are
# referenced anywhere in this workflow, because none of the test scripts read
# process.env, call fetch, or need an API key.
permissions:
  contents: read

# github.ref differs per trigger (refs/pull/N/merge for a PR, refs/heads/main
# for a merge), so PR runs and main runs never cancel each other. Within one PR,
# a new push supersedes the run it replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This exact string is the required status check in the "WordSwipe - Main
    # Protection" ruleset. Renaming the job silently detaches that gate, so the
    # ruleset must be updated in the same change.
    name: Types and test suites
    runs-on: ubuntu-latest # none of the five commands need macOS or Xcode
    timeout-minutes: 15

    steps:
      # Third-party actions are pinned to a commit SHA, not a moving tag.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # The repo pins no Node version (no .nvmrc, no engines field), so the
          # choice is made here. 22 is the active LTS.
          node-version: '22'
          cache: npm

      # package-lock.json is lockfileVersion 3 and in sync with package.json,
      # so ci is safe and reproducible.
      - name: Install dependencies
        run: npm ci

      # Every suite runs under `!cancelled()`: one failing suite still lets the
      # others report, but a cancelled run stops instead of grinding through all
      # five. A failing suite fails its step, and a failing step fails the job —
      # there is no path that reports success on a failed or missing command.
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Quiz tests
        if: ${{ !cancelled() }}
        run: npm run test:quiz

      - name: SRS tests
        if: ${{ !cancelled() }}
        run: npm run test:srs

      # The grammar suite reports "known limits" — acknowledged local-rule gaps.
      # Those are not regressions and the suite exits 0 with them present.
      - name: Grammar tests
        if: ${{ !cancelled() }}
        run: npm run test:grammar

      - name: Vocabulary validation
        if: ${{ !cancelled() }}
        run: npm run validate:vocab
